<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account | EventAura</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eef2ff,#f8fafc);font-family:Segoe UI,Arial,sans-serif;color:#17233f}.card{width:min(460px,100%);background:#fff;padding:36px;border-radius:24px;box-shadow:0 20px 60px #1e293b1a}h1{margin:0 0 8px;font-size:30px}.muted{color:#64748b;line-height:1.6}.brand{color:#4f46e5;font-weight:800;letter-spacing:.5px;margin-bottom:20px}label{display:block;margin:16px 0 7px;font-weight:650}input{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}button{width:100%;margin-top:22px;border:0;border-radius:11px;padding:14px;background:linear-gradient(110deg,#172746,#6254e8);color:#fff;font-size:16px;font-weight:700;cursor:pointer}.foot{text-align:center;margin-top:20px}.foot a{color:#4f46e5;font-weight:700;text-decoration:none}.flash{padding:10px 12px;margin:12px 0;border-radius:9px;background:#fff1f2;color:#9f1239}</style></head><body><main class="card"><div class="brand">EventAura</div><h1>Create organizer account</h1><p class="muted">Create an account to organize events and manage your participants.</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><label for="full_name">Full name</label><input id="full_name" name="full_name" autocomplete="name" required><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required><label for="password">Password (at least 8 characters)</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required><label for="confirm_password">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required><button type="submit">Create account</button></form><p class="foot">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p></main></body></html>
